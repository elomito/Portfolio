<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1238" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <!-- Background App Shell (Light/Clean with White Panels) -->
  <rect width="1200" height="675" fill="#F8FAFC" />

  <!-- Top Navigation Bar -->
  <rect width="1200" height="54" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Wapi Logo -->
  <text x="30" y="36" fill="#DC2626" font-family="'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5">Wapi</text>
  <text x="95" y="34" fill="#475569" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Following</text>
  <text x="170" y="34" fill="#475569" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Browse</text>
  
  <!-- Search Input Bar -->
  <rect x="380" y="10" width="400" height="34" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="400" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Search live Kenyan streams...</text>
  <rect x="740" y="10" width="40" height="34" rx="0" fill="#DC2626" />
  <circle cx="757" cy="24" r="5" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <line x1="761" y1="28" x2="767" y2="33" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

  <!-- Header Right Actions -->
  <rect x="1030" y="11" width="115" height="32" rx="4" fill="#DC2626" />
  <text x="1040" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="11">GO Ad-Free For Free</text>
  <circle cx="1165" cy="27" r="14" fill="#E2E8F0" />
  <text x="1161" y="32" fill="#475569" font-family="'Inter', sans-serif" font-weight="700" font-size="12">L</text>

  <!-- Left Sidebar (Followed Channels) -->
  <rect x="0" y="54" width="160" height="621" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="16" y="80" fill="#64748B" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">FOLLOWED CHANNELS</text>
  
  <!-- Channel item 1 -->
  <circle cx="28" cy="115" r="14" fill="#3B82F6" />
  <text x="50" y="115" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="600" font-size="12">CoolGamer7</text>
  <text x="50" y="128" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">GTA V Live</text>
  <circle cx="140" cy="118" r="3" fill="#DC2626" />
  <text x="146" y="121" fill="#DC2626" font-family="'Inter', sans-serif" font-size="10" font-weight="600">2.5K</text>

  <!-- Channel item 2 -->
  <circle cx="28" cy="165" r="14" fill="#10B981" />
  <text x="50" y="165" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="600" font-size="12">BeeWalker +1</text>
  <text x="50" y="178" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Drive Beyond</text>
  <circle cx="140" cy="168" r="3" fill="#DC2626" />
  <text x="146" y="171" fill="#DC2626" font-family="'Inter', sans-serif" font-size="10" font-weight="600">2.1K</text>

  <!-- Channel item 3 -->
  <circle cx="28" cy="215" r="14" fill="#F59E0B" />
  <text x="50" y="215" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="600" font-size="12">PixPio</text>
  <text x="50" y="228" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Marvel Rivals</text>
  <circle cx="140" cy="218" r="3" fill="#DC2626" />
  <text x="146" y="221" fill="#DC2626" font-family="'Inter', sans-serif" font-size="10" font-weight="600">8.4K</text>

  <!-- Channel item 4 -->
  <circle cx="28" cy="265" r="14" fill="#8B5CF6" />
  <text x="50" y="265" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="600" font-size="12">DreamChaser</text>
  <text x="50" y="278" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Just Chatting</text>
  <circle cx="140" cy="268" r="3" fill="#DC2626" />
  <text x="146" y="271" fill="#DC2626" font-family="'Inter', sans-serif" font-size="10" font-weight="600">8.4K</text>

  <!-- Channel item 5 -->
  <circle cx="28" cy="315" r="14" fill="#EC4899" />
  <text x="50" y="315" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="600" font-size="12">StreamSens</text>
  <text x="50" y="328" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Nairobi Beats</text>
  <circle cx="140" cy="318" r="3" fill="#DC2626" />
  <text x="146" y="321" fill="#DC2626" font-family="'Inter', sans-serif" font-size="10" font-weight="600">860</text>

  <!-- MAIN STAGE / HERO BROADCAST -->
  <g transform="translate(180, 75)">
    <!-- Video Player Container with rounded corners -->
    <rect width="650" height="340" rx="8" fill="url(#streamGrad)" />
    
    <!-- Neon Lighting and streamer silhouette simulation -->
    <circle cx="340" cy="180" r="90" fill="#EC4899" opacity="0.3" filter="blur(20px)" />
    <circle cx="480" cy="140" r="70" fill="#06B6D4" opacity="0.35" filter="blur(15px)" />

    <!-- Streamer silhouette illustration -->
    <circle cx="370" cy="160" r="42" fill="#0F172A" />
    <path d="M300 300 C300 230 440 230 440 300 Z" fill="#0F172A" />
    <rect x="420" y="220" width="120" height="70" rx="4" fill="#38BDF8" opacity="0.7" />

    <!-- LIVE badge -->
    <rect x="18" y="16" width="52" height="22" rx="4" fill="#DC2626" />
    <text x="31" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
    
    <!-- Video Overlay Controls -->
    <rect x="0" y="300" width="650" height="40" rx="0" fill="#000000" opacity="0.6" />
    <polygon points="25,315 25,327 37,321" fill="#FFFFFF" />
    <rect x="50" y="318" width="510" height="5" rx="2" fill="#475569" />
    <rect x="50" y="318" width="220" height="5" rx="2" fill="#DC2626" />
    <circle cx="270" cy="320" r="6" fill="#FFFFFF" />
    <text x="580" y="324" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11">HD WebRTC</text>

    <!-- Floating Info Card on Right of Stage (Stream info) -->
    <g transform="translate(670, 0)">
      <rect width="320" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="35" cy="40" r="18" fill="#CBD5E1" />
      <text x="65" y="38" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="700" font-size="15">MeetUpVibe</text>
      <text x="65" y="54" fill="#DC2626" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Special Events • Livepeer</text>
      
      <text x="20" y="90" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">6.9K viewers streaming</text>
      
      <rect x="20" y="105" width="105" height="22" rx="4" fill="#DC2626" />
      <text x="27" y="120" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="10">CommunityMeetups</text>

      <rect x="135" y="105" width="55" height="22" rx="4" fill="#DC2626" />
      <text x="146" y="120" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="10">MeetUp</text>

      <text x="20" y="155" fill="#334155" font-family="'Inter', sans-serif" font-size="12" width="280">
        Gear up for the ultimate streamer showdown with
      </text>
      <text x="20" y="173" fill="#334155" font-family="'Inter', sans-serif" font-size="12">
        Twitch Rivals! Watch top creators clash in epic battles,
      </text>
      <text x="20" y="191" fill="#334155" font-family="'Inter', sans-serif" font-size="12">
        with instant M-Pesa tipping and token rewards.
      </text>

      <!-- Instant Tipping M-Pesa simulation badge -->
      <rect x="20" y="240" width="280" height="70" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
      <circle cx="45" cy="275" r="14" fill="#16A34A" />
      <text x="40" y="280" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="13">K</text>
      <text x="70" y="268" fill="#166534" font-family="'Inter', sans-serif" font-weight="700" font-size="12">M-Pesa STK Push Tipping</text>
      <text x="70" y="285" fill="#15803D" font-family="'Inter', sans-serif" font-size="11">Instant tip 100 KES directly to streamer</text>
    </g>
  </g>

  <!-- Bottom Section: "Live channels we think you'll like" -->
  <g transform="translate(180, 440)">
    <text x="0" y="20" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Live channels we think you'll like</text>
    
    <!-- Channel Card 1 -->
    <g transform="translate(0, 35)">
      <rect width="315" height="150" rx="8" fill="url(#cardGrad1)" />
      <rect x="12" y="12" width="46" height="20" rx="3" fill="#DC2626" />
      <text x="21" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="10">LIVE</text>
      <rect x="12" y="110" width="290" height="28" rx="4" fill="#000000" opacity="0.6" />
      <text x="22" y="128" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Nairobi Speed Racing 4G</text>
    </g>

    <!-- Channel Card 2 -->
    <g transform="translate(335, 35)">
      <rect width="315" height="150" rx="8" fill="url(#cardGrad2)" />
      <rect x="12" y="12" width="46" height="20" rx="3" fill="#DC2626" />
      <text x="21" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="10">LIVE</text>
      <rect x="12" y="110" width="290" height="28" rx="4" fill="#000000" opacity="0.6" />
      <text x="22" y="128" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Kisumu Tech Hackathon Live</text>
    </g>

    <!-- Channel Card 3 -->
    <g transform="translate(670, 35)">
      <rect width="320" height="150" rx="8" fill="#3B0764" />
      <rect x="12" y="12" width="46" height="20" rx="3" fill="#DC2626" />
      <text x="21" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="10">LIVE</text>
      <rect x="12" y="110" width="295" height="28" rx="4" fill="#000000" opacity="0.6" />
      <text x="22" y="128" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Afrobeats Acoustic Live Session</text>
    </g>
  </g>
</svg>
