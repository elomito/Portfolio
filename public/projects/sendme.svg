<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Off-white Background -->
  <rect width="1200" height="675" fill="#F8FAFC" />

  <!-- Top Header Bar -->
  <rect width="1200" height="70" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" />
  
  <g transform="translate(140, 16)">
    <!-- Logo Badge SM -->
    <rect width="38" height="38" rx="10" fill="#6D28D9" />
    <text x="19" y="24" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="14">SM</text>
    
    <!-- Title -->
    <text x="50" y="19" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="-0.2">SENDME</text>
    <text x="50" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="1">CLUSTER HUB</text>
  </g>

  <!-- User on Header Right -->
  <g transform="translate(950, 24)">
    <text x="0" y="14" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="700" font-size="12">xtra</text>
    <text x="-35" y="27" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">xtra8477@gmail.com</text>
    <path d="M75 6 H88 M83 1 L88 6 L83 11 M75 1 V11" stroke="#475569" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Hero Area -->
  <g transform="translate(140, 130)">
    <!-- Title -->
    <text x="0" y="30" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8">Hey there,</text>
    <text x="0" y="68" fill="#6D28D9" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8">Got an errand?</text>

    <!-- Request New Item Button -->
    <g transform="translate(680, 20)">
      <rect width="210" height="52" rx="14" fill="#6D28D9" filter="url(#purpleGlow)" />
      <path d="M32 26 H44 M38 20 V32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <text x="55" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Request New Item</text>
    </g>

    <!-- Navigation Tabs Pill -->
    <g transform="translate(0, 120)">
      <rect width="420" height="48" rx="12" fill="#F1F5F9" />
      
      <!-- Active Task Feed Tab -->
      <rect x="4" y="4" width="130" height="40" rx="10" fill="#FFFFFF" filter="url(#cardShadow)" />
      <!-- Grid icon -->
      <rect x="22" y="16" width="6" height="6" rx="1" fill="#6D28D9" />
      <rect x="31" y="16" width="6" height="6" rx="1" fill="#6D28D9" />
      <rect x="22" y="25" width="6" height="6" rx="1" fill="#6D28D9" />
      <rect x="31" y="25" width="6" height="6" rx="1" fill="#6D28D9" />
      <text x="46" y="29" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Task Feed</text>

      <!-- My Requests Tab -->
      <text x="175" y="29" fill="#64748B" font-family="'Inter', sans-serif" font-weight="600" font-size="13">My Requests</text>

      <!-- Active Runs Tab -->
      <text x="310" y="29" fill="#64748B" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Active Runs</text>
    </g>

    <!-- Errand Card -->
    <g transform="translate(0, 200)">
      <rect width="280" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
      
      <!-- Header row of card: PENDING pill & author -->
      <rect x="18" y="18" width="75" height="24" rx="12" fill="#FEF3C7" />
      <circle cx="28" cy="30" r="3" fill="#D97706" />
      <text x="36" y="34" fill="#B45309" font-family="'Inter', sans-serif" font-weight="700" font-size="10">PENDING</text>
      
      <circle cx="205" cy="30" r="5" fill="#CBD5E1" />
      <text x="216" y="34" fill="#64748B" font-family="'Inter', sans-serif" font-weight="500" font-size="11">xtra</text>
      <rect x="245" y="22" width="24" height="16" rx="4" fill="#F1F5F9" />
      <text x="248" y="34" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">You</text>

      <!-- Errand Item Title -->
      <g transform="translate(18, 65)">
        <!-- Box icon -->
        <rect x="0" y="0" width="16" height="16" rx="2" fill="none" stroke="#64748B" stroke-width="1.5" />
        <line x1="0" y1="6" x2="16" y2="6" stroke="#64748B" stroke-width="1.2" />
        <text x="26" y="14" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Notebook</text>
      </g>

      <!-- Note bubble -->
      <rect x="18" y="98" width="244" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="3 3" />
      <text x="30" y="122" fill="#475569" font-family="'Inter', sans-serif" font-style="italic" font-size="12">"Let it be a diary-like"</text>

      <!-- Divider -->
      <line x1="18" y1="160" x2="262" y2="160" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Payout row -->
      <text x="18" y="180" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" letter-spacing="0.5">COMMISSION</text>
      <text x="18" y="202" fill="#7C3AED" font-family="'Inter', sans-serif" font-weight="800" font-size="14">KES 20</text>

      <text x="180" y="180" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" letter-spacing="0.5">TOTAL PAYOUT</text>
      <text x="180" y="202" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="800" font-size="14">KES 120</text>
    </g>
  </g>
</svg>
