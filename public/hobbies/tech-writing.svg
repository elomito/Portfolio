<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="writeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A111E" />
      <stop offset="50%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#writeGrad)" />

  <g transform="translate(180, 100)">
    <!-- Main Markdown Editor Screen -->
    <rect width="840" height="520" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2" />
    
    <!-- Top Editor Header -->
    <rect width="840" height="42" rx="16" fill="#161B22" />
    <circle cx="28" cy="21" r="7" fill="#FF5F56" />
    <circle cx="50" cy="21" r="7" fill="#FFBD2E" />
    <circle cx="72" cy="21" r="7" fill="#27C93F" />
    <text x="100" y="27" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="13">dev.to/elomito/low-latency-live-streaming.md</text>
    
    <!-- Dev.to Badge -->
    <rect x="740" y="9" width="70" height="24" rx="4" fill="#000000" stroke="#30363D" stroke-width="1" />
    <text x="752" y="25" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11">DEV</text>

    <!-- Editor Body (Split Markdown & Preview) -->
    <!-- Left Markdown Editor -->
    <g transform="translate(30, 70)" font-family="'JetBrains Mono', monospace" font-size="14">
      <text x="0" y="20" fill="#79C0FF"># Technical Writing &amp; Open Source</text>
      <text x="0" y="55" fill="#8B949E">Learning in public and contributing to open-source.</text>
      
      <text x="0" y="95" fill="#FF7B72">## Technologies Explored</text>
      <text x="0" y="125" fill="#C9D1D9">- **Go &amp; Linux System Calls**</text>
      <text x="0" y="150" fill="#C9D1D9">- **Git Workflow &amp; PR Reviews**</text>
      <text x="0" y="175" fill="#C9D1D9">- **DevOps Pipeline Automation**</text>

      <text x="0" y="220" fill="#79C0FF">```go</text>
      <text x="0" y="245" fill="#FFA657">func HandleStreamIngest(w http.ResponseWriter) {</text>
      <text x="20" y="270" fill="#D2A8FF">    log.Println("Sub-second WebRTC peer synchronized")</text>
      <text x="0" y="295" fill="#FFA657">}</text>
      <text x="0" y="320" fill="#79C0FF">```</text>
    </g>

    <!-- Vertical Divider -->
    <line x1="450" y1="42" x2="450" y2="520" stroke="#30363D" stroke-width="1" />

    <!-- Right Open Source Branch / Community Visualization -->
    <g transform="translate(480, 70)">
      <text x="0" y="22" fill="#58A6FF" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Git Collaboration &amp; Pull Requests</text>
      
      <!-- Commit branch visualization -->
      <g transform="translate(10, 50)">
        <line x1="20" y1="20" x2="20" y2="280" stroke="#38BDF8" stroke-width="3" />
        <circle cx="20" cy="30" r="8" fill="#38BDF8" />
        <text x="40" y="35" fill="#E6EDF3" font-family="monospace" font-size="12">feat: WebSockets real-time chat hub</text>

        <circle cx="20" cy="100" r="8" fill="#A855F7" />
        <text x="40" y="105" fill="#E6EDF3" font-family="monospace" font-size="12">fix: LND hold-invoice settlement</text>

        <circle cx="20" cy="170" r="8" fill="#34D399" />
        <text x="40" y="175" fill="#E6EDF3" font-family="monospace" font-size="12">docs: Sub-Saharan network optimization</text>

        <circle cx="20" cy="240" r="8" fill="#FBBF24" />
        <text x="40" y="245" fill="#E6EDF3" font-family="monospace" font-size="12">merged: Pull Request #42 into main</text>
      </g>
    </g>
  </g>

  <!-- Bottom Label -->
  <text x="600" y="695" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="2">
    TECHNICAL WRITING · DEV.TO · OPEN SOURCE COLLABORATION
  </text>
</svg>
