<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#111B33" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E4DB7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Matrix Grid Lines -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
  </g>

  <!-- Central Workstation & Forensics Lab -->
  <g transform="translate(180, 120)">
    <!-- Terminal Window -->
    <rect width="840" height="500" rx="14" fill="#0C101D" stroke="#1E3259" stroke-width="2" />
    
    <!-- Window Bar -->
    <rect width="840" height="42" rx="14" fill="#141E34" />
    <circle cx="28" cy="21" r="7" fill="#EF4444" />
    <circle cx="50" cy="21" r="7" fill="#F59E0B" />
    <circle cx="72" cy="21" r="7" fill="#10B981" />
    <text x="100" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="14">elomito@cyber-forensics-lab: ~/ctf/overthewire (Wireshark + Ghidra)</text>

    <!-- Terminal Lines -->
    <g transform="translate(35, 80)" font-family="'JetBrains Mono', monospace" font-size="16">
      <text x="0" y="20" fill="#38BDF8">┌──(elizabeth㉿forensics)-[~/labs/bandit]</text>
      <text x="0" y="48" fill="#38BDF8">└─$ </text>
      <text x="45" y="48" fill="#FFFFFF">tshark -r capture.pcap -Y "http.request.method == 'POST'" -T fields -e http.file_data</text>
      
      <text x="0" y="90" fill="#4ADE80">[✓] Wireshark Packet Inspection: 1,482 frames analyzed</text>
      <text x="0" y="118" fill="#A855F7">[+] CTF Flag Extracted: OverTheWire{b4nd1t_d1g1t4l_f0r3ns1cs_m4st3r}</text>
      
      <text x="0" y="160" fill="#38BDF8">┌──(elizabeth㉿forensics)-[~/cryptography/natas]</text>
      <text x="0" y="188" fill="#38BDF8">└─$ </text>
      <text x="45" y="188" fill="#FFFFFF">python3 decrypt_xor.py --key-len 32 --analyze-entropy</text>
      <text x="0" y="230" fill="#FACC15">[!] Frequency Analysis: AES-256 GCM authenticated ciphertext verified</text>
      <text x="0" y="258" fill="#10B981">[✓] Threat Modeling: 0 unauthorized attack surfaces detected</text>
    </g>

    <!-- Shield Emblem on Right Side -->
    <g transform="translate(620, 260)">
      <path d="M70 20 L130 50 V130 C130 180 70 220 70 220 C70 220 10 180 10 130 V50 Z" fill="url(#shieldGrad)" opacity="0.85" />
      <path d="M70 45 L115 68 V125 C115 162 70 195 70 195 C70 195 25 162 25 125 V68 Z" fill="#0C101D" />
      <path d="M70 75 L85 105 H55 Z M60 115 H80 V150 H60 Z" fill="#38BDF8" />
    </g>
  </g>

  <!-- Bottom Label -->
  <text x="600" y="695" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="2">
    CYBERSECURITY CTFS · DIGITAL FORENSICS · WIRESHARK
  </text>
</svg>
